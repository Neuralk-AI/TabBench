[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tabbench"
dynamic = ["version"]
authors = [
    { name = "Neuralk AI Research Team", email = "alex@neuralk-ai.com" },
    { name = "Aziz Fouché", email = "aziz.fouche@neuralk-ai.com"},  # Main point of contact
    { name = "Alexandre Pasquiou", email = "alex@neuralk-ai.com"},
    { name = "Alexandre Abraham", email = "alexandre.abraham@neuralk-ai.com"},
    { name = "Frosso Papanastasiou", email = "frosso.papanastasiou@neuralk-ai.com"},
]
description = "Datasets and scripts for tabular benchmark."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = [
    "openml>=0.15.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "torch>=2.0",
]

[project.urls]
Homepage = "https://neuralk-ai.com"
Documentation = "https://huggingface.co/spaces/Neuralk-AI/TabBench"
Repository = "https://github.com/Neuralk-AI/tabbench"

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.dynamic]
version = {file = "src/tabbench/VERSION.txt"}

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 90
extend-exclude = ["src/tabbench/datasets/openml/"]

[tool.ruff.lint]
select = ["E501"]
